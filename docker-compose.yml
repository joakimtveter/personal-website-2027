# Local Postgres for development. Run the app itself on the host with `pnpm dev`:
# the Postgres adapter only uses a plain `pg` connection when the POSTGRES_URL host
# is `localhost` or `127.0.0.1`, so a containerized app pointing at `postgres:5432`
# would try to connect through @vercel/postgres instead.
services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-personal-website}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
